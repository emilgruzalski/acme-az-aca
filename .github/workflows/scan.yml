name: Security scan

# Recurring scan of what is already released: a red run here means "the image
# people are running has a known vulnerability", not "a change broke CI".
on:
  schedule:
    # Weekly — new CVEs surface without any commit.
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scan Go dependencies for known vulnerabilities
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-file: go.mod

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check a published image exists
        id: published
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$IMAGE is not published yet, skipping image scan"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan published image for CVEs
        if: steps.published.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          format: sarif
          output: trivy.sarif
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Upload even when the scan gate fails, so findings show up in the
      # Security tab.
      - name: Upload scan results to GitHub Security
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: published-image
